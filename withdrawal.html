<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Withdrawal Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #060911;
            --card-bg: rgba(18, 26, 41, 0.75);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-green: #00e676;
            --accent-glow: rgba(0, 230, 118, 0.35);
            --accent-blue: #00f2fe;
            --text-muted: #64748b;
            --text-light: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; user-select: none; }
        
        body { 
            background: radial-gradient(circle at top center, #111a2e 0%, var(--bg-main) 70%); 
            color: #fff; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            padding: 25px 15px; 
            position: relative;
            overflow-x: hidden;
        }

        /* Top Header & Canvas Logo */
        .header-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 25px;
            animation: fadeInDown 0.6s ease;
        }
        #platformLogo { width: 70px; height: 70px; filter: drop-shadow(0 0 15px rgba(0, 230, 118, 0.4)); }
        .brand-title {
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 10px;
        }
        .vip-badge {
            font-size: 10px;
            font-weight: 700;
            color: #ffd700;
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            padding: 2px 8px;
            border-radius: 20px;
            margin-top: 4px;
            letter-spacing: 1px;
        }

        /* Glassmorphic Card Wrapper */
        .withdrawal-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 440px;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(0, 230, 118, 0.03);
            animation: fadeInUp 0.6s ease;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }
        .card-title { font-size: 15px; font-weight: 700; color: #f1f5f9; }
        .back-link {
            color: var(--accent-green);
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: opacity 0.2s;
        }
        .back-link:hover { opacity: 0.8; }

        /* Segmented Floating Tabs */
        .tabs-wrapper {
            background: rgba(10, 15, 29, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 4px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            margin-bottom: 22px;
        }
        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-light);
            font-size: 12px;
            font-weight: 600;
            padding: 10px 0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, rgba(0, 230, 118, 0.2) 0%, rgba(0, 230, 118, 0.05) 100%);
            color: var(--accent-green);
            border: 1px solid rgba(0, 230, 118, 0.4);
            box-shadow: 0 4px 12px rgba(0, 230, 118, 0.15);
            font-weight: 700;
        }

        /* Form Elements */
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease; }

        .form-group { margin-bottom: 16px; position: relative; }
        .form-group label {
            display: block;
            font-size: 11px;
            color: var(--text-light);
            font-weight: 600;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .input-box {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-box svg {
            position: absolute;
            left: 14px;
            width: 16px;
            height: 16px;
            fill: none;
            stroke: var(--text-muted);
            stroke-width: 2;
            transition: stroke 0.2s;
        }
        .form-control {
            width: 100%;
            background: rgba(10, 15, 29, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px 14px 12px 40px;
            color: #fff;
            font-size: 13px;
            font-weight: 500;
            outline: none;
            transition: all 0.25s ease;
        }
        .form-control:focus {
            border-color: var(--accent-green);
            box-shadow: 0 0 15px rgba(0, 230, 118, 0.2);
            background: rgba(10, 15, 29, 0.9);
        }
        .form-control:focus + svg { stroke: var(--accent-green); }
        .form-control:disabled {
            background: rgba(15, 23, 42, 0.5);
            color: #475569;
            border-color: rgba(255, 255, 255, 0.03);
            cursor: not-allowed;
        }

        /* Submit Button */
        .btn-save {
            width: 100%;
            margin-top: 10px;
            background: linear-gradient(135deg, #00e676 0%, #00b0ff 100%);
            color: #040914;
            font-weight: 800;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-size: 13px;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 230, 118, 0.25);
            transition: all 0.25s ease;
        }
        .btn-save:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(0, 230, 118, 0.4);
        }
        .btn-save:active { transform: translateY(0); }
        .btn-save:disabled {
            background: rgba(30, 41, 59, 0.8);
            color: #475569;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        /* Status Lock Banner */
        .locked-badge {
            display: none;
            background: rgba(0, 230, 118, 0.08);
            border: 1px solid rgba(0, 230, 118, 0.25);
            color: var(--accent-green);
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 18px;
            text-align: center;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* Custom Toast Notification */
        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            color: #fff;
            padding: 12px 18px;
            border-radius: 10px;
            border-left: 4px solid var(--accent-green);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            font-size: 13px;
            font-weight: 600;
            opacity: 0;
            transform: translateX(40px);
            transition: all 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }
        .toast.show { opacity: 1; transform: translateX(0); }
        .toast.error { border-left-color: #ff5252; }
        .toast.warning { border-left-color: #ffb74d; }

        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <!-- VIP Header -->
    <div class="header-brand">

        <div class="brand-title">PAYOUT CENTER</div>

        <!-- Bank Tab Content -->
        <div id="tab-bank" class="tab-content">
            <div id="bank-locked-msg" class="locked-badge">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                Account Linked & Locked
            </div>
            <form id="form-bank" onsubmit="handleSave(event, 'bank')">
                <div class="form-group">
                    <label>Account Holder Name</label>
                    <div class="input-box">
                        <input type="text" id="bank-fullname" class="form-control" placeholder="As per bank records" required>

        <!-- USDT Tab Content -->
        <div id="tab-usdt" class="tab-content">

        <!-- Crypto Tab Content -->
        <div id="tab-crypto" class="tab-content">

                Account Linked & Locked
            </div>
            <form id="form-crypto" onsubmit="handleSave(event, 'crypto')">
                <div class="form-group">
                    <label>Crypto Currency Token</label>
                    <div class="input-box">

    <!-- Firebase System Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAr-uCBGJd9qL2k99DJEfpiftJy5RXDfvY",
            authDomain: "recording-884bb.firebaseapp.com",
            databaseURL: "https://recording-884bb-default-rtdb.firebaseio.com",
            projectId: "recording-884bb",
            storageBucket: "recording-884bb.firebasestorage.app",
            messagingSenderId: "761583827852",
            appId: "1:761583827852:web:64efb0c82bc66ed1c034a9",
            measurementId: "G-7ML390B1MX"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        /* --- Custom 3D Shield Vector Logo Canvas --- */
        function drawUltraLogo() {
            const canvas = document.getElementById('platformLogo');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const cx = 70, cy = 70;

            // Gradient Outer Hexagon
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                let angle = (Math.PI / 3) * i - Math.PI / 6;
                let x = cx + 55 * Math.cos(angle);
                let y = cy + 55 * Math.sin(angle);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            let gradOuter = ctx.createLinearGradient(0, 0, 140, 140);
            gradOuter.addColorStop(0, '#00e676');
            gradOuter.addColorStop(1, '#00b0ff');
            ctx.strokeStyle = gradOuter;
            ctx.lineWidth = 3;
            ctx.stroke();

            // Inner Shield
            ctx.beginPath();
            ctx.moveTo(cx, cy - 35);
            ctx.lineTo(cx + 30, cy - 20);
            ctx.lineTo(cx + 30, cy + 15);
            ctx.quadraticCurveTo(cx, cy + 42, cx, cy + 42);
            ctx.quadraticCurveTo(cx - 30, cy + 15, cx - 30, cy + 15);
            ctx.lineTo(cx - 30, cy - 20);
            ctx.closePath();
            
            let gradShield = ctx.createLinearGradient(cx - 30, cy - 35, cx + 30, cy + 42);
            gradShield.addColorStop(0, '#121a29');
            gradShield.addColorStop(1, '#0a0f1d');
            ctx.fillStyle = gradShield;
            ctx.fill();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Trending Arrow Graphic Inside Shield
            ctx.beginPath();
            ctx.moveTo(cx - 16, cy + 10);
            ctx.lineTo(cx - 4, cy - 2);
            ctx.lineTo(cx + 4, cy + 4);
            ctx.lineTo(cx + 16, cy - 10);
            ctx.strokeStyle = '#00e676';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(cx + 8, cy - 10);
            ctx.lineTo(cx + 16, cy - 10);
            ctx.lineTo(cx + 16, cy - 2);
            ctx.strokeStyle = '#00e676';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.stroke();
        }
        drawUltraLogo();

        /* --- Toast Notification System --- */
        window.showToast = function(msg, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        };

        /* --- Active User Resolution --- */
        let activeUser = JSON.parse(localStorage.getItem('activeUser')) || { uid: 'USER_' + Math.floor(100000 + Math.random() * 900000) };

        /* --- Tab Switcher --- */
        window.switchTab = function(event, type) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if (event) event.currentTarget.classList.add('active');
            document.getElementById(`tab-${type}`).classList.add('active');
        };

        /* --- Firebase Save Action --- */
        window.handleSave = async function(event, type) {
            event.preventDefault();
            let dataToSave = {};

            if (type === 'upi') {
                const id = document.getElementById('upi-id').value;
                const reId = document.getElementById('upi-re-id').value;
                if (id !== reId) {
                    showToast("UPI IDs do not match!", "error");
                    return;
                }
                dataToSave = {
                    fullName: document.getElementById('upi-fullname').value,
                    upiId: id
                };
            } else if (type === 'bank') {
                dataToSave = {
                    fullName: document.getElementById('bank-fullname').value,
                    acNo: document.getElementById('bank-ac').value,
                    phone: document.getElementById('bank-phone').value,
                    ifsc: document.getElementById('bank-ifsc').value,
                    bankName: document.getElementById('bank-name').value
                };
            } else if (type === 'usdt') {
                dataToSave = {
                    fullName: document.getElementById('usdt-fullname').value,
                    address: document.getElementById('usdt-address').value,
                    phone: document.getElementById('usdt-phone').value
                };
            } else if (type === 'crypto') {
                dataToSave = {
                    currency: document.getElementById('crypto-currency').value,
                    tonWallet: document.getElementById('crypto-ton').value
                };
            }

            try {
                await set(ref(db, `withdrawal_details/${activeUser.uid}/${type}`), dataToSave);
                showToast("Withdrawal details encrypted & saved!", "success");
                lockForm(type);
            } catch (error) {
                console.error(error);
                showToast("Failed to sync database!", "error");
            }
        };

        /* --- Load Locked State from Realtime DB --- */
        async function fetchSavedDataFromFirebase() {
            const dbRef = ref(db);
            try {
                const snapshot = await get(child(dbRef, `withdrawal_details/${activeUser.uid}`));
                if (snapshot.exists()) {
                    const data = snapshot.val();

                    if (data.upi) {
                        document.getElementById('upi-fullname').value = data.upi.fullName || '';
                        document.getElementById('upi-id').value = data.upi.upiId || '';
                        document.getElementById('upi-re-id').value = data.upi.upiId || '';
                        lockForm('upi');
                    }
                    if (data.bank) {
                        document.getElementById('bank-fullname').value = data.bank.fullName || '';
                        document.getElementById('bank-ac').value = data.bank.acNo || '';
                        document.getElementById('bank-phone').value = data.bank.phone || '';
                        document.getElementById('bank-ifsc').value = data.bank.ifsc || '';
                        document.getElementById('bank-name').value = data.bank.bankName || '';
                        lockForm('bank');
                    }
                    if (data.usdt) {
                        document.getElementById('usdt-fullname').value = data.usdt.fullName || '';
                        document.getElementById('usdt-address').value = data.usdt.address || '';
                        document.getElementById('usdt-phone').value = data.usdt.phone || '';
                        lockForm('usdt');
                    }
                    if (data.crypto) {
                        document.getElementById('crypto-currency').value = data.crypto.currency || '';
                        document.getElementById('crypto-ton').value = data.crypto.tonWallet || '';
                        lockForm('crypto');
                    }
                }
            } catch (error) {
                console.error("Firebase Sync Exception:", error);
            }
        }

        function lockForm(type) {
            const form = document.getElementById(`form-${type}`);
            const inputs = form.querySelectorAll('.form-control');
            inputs.forEach(input => input.disabled = true);

            const btn = document.getElementById(`${type}-btn`);
            btn.disabled = true;
            btn.innerText = "DETAILS PERMANENTLY LOCKED";

            const lockedMsg = document.getElementById(`${type}-locked-msg`);
            lockedMsg.style.display = "flex";
        }

        fetchSavedDataFromFirebase();
    </script>
</body>
</html>
