<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VERTEX | Chart Learning</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Inter','Segoe UI',Tahoma,Geneva,Verdana,sans-serif; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; }
body { background:#060911; color:#fff; min-height:100vh; padding-bottom:30px; }

/* ============================================================
   HEADER WITH SKETCH LOGO
   ============================================================ */
.header {
    height:70px;
    background:rgba(23,33,45,0.95);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px;
    border-bottom:1px solid #233142;
    position:sticky;
    top:0;
    z-index:100;
}
.header-left {
    display:flex;
    align-items:center;
    gap:10px;
    min-width:60px;
}
.back-btn {
    display:flex;
    align-items:center;
    justify-content:center;
    width:38px;
    height:38px;
    border-radius:10px;
    background:rgba(255,255,255,0.03);
    border:1px solid #233142;
    color:#8a9ba8;
    text-decoration:none;
    transition:all 0.2s;
    flex-shrink:0;
}
.back-btn:hover { color:#00e676; border-color:rgba(0,230,118,0.35); background:rgba(0,230,118,0.06); }
.back-btn svg { width:18px; height:18px; }

.header-center {
    display:flex;
    align-items:center;
    gap:10px;
    flex:1;
    justify-content:center;
}
.header-logo {
    width:40px;
    height:40px;
    display:block;
    flex-shrink:0;
    filter:drop-shadow(0 0 8px rgba(0,230,118,0.25));
}
.header-titles {
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    line-height:1.15;
}
.header-title-main {
    font-size:14px;
    font-weight:800;
    letter-spacing:0.4px;
    color:#ffffff;
    display:flex;
    align-items:center;
    gap:6px;
}
.header-title-main .chart-icon {
    width:15px;
    height:15px;
    stroke:#00e676;
    fill:none;
    stroke-width:2.2;
    stroke-linecap:round;
    stroke-linejoin:round;
}
.header-title-sub {
    font-size:9.5px;
    font-weight:700;
    letter-spacing:1.6px;
    color:#00e676;
    text-transform:uppercase;
    margin-top:2px;
}

.header-right {
    min-width:60px;
    text-align:right;
    font-size:10.5px;
    font-weight:700;
    color:#8a9ba8;
    letter-spacing:0.3px;
}

/* ============================================================
   SEARCH
   ============================================================ */
.search-bar-wrap {
    padding:14px 14px 6px;
    max-width:1200px;
    margin:0 auto;
}
.search-bar {
    width:100%;
    background:#131b26;
    border:1px solid #233142;
    color:#fff;
    padding:13px 16px;
    border-radius:11px;
    font-size:13px;
    outline:none;
    transition:border-color 0.2s, background 0.2s;
    font-family:inherit;
}
.search-bar:focus { border-color:rgba(0,230,118,0.5); background:#17212d; }
.search-bar::placeholder { color:#4d5c6b; }

/* ============================================================
   FILTER CHIPS
   ============================================================ */
.filter-chips {
    display:flex;
    gap:6px;
    padding:12px 14px 4px;
    max-width:1200px;
    margin:0 auto;
    flex-wrap:wrap;
}
.filter-chip {
    background:#17212d;
    border:1px solid #233142;
    color:#8a9ba8;
    padding:6px 12px;
    border-radius:20px;
    font-size:11px;
    font-weight:700;
    cursor:pointer;
    letter-spacing:0.4px;
    transition:all 0.2s;
    font-family:inherit;
}
.filter-chip:hover { color:#fff; border-color:#334155; }
.filter-chip.active {
    background:rgba(0,230,118,0.1);
    border-color:rgba(0,230,118,0.4);
    color:#00e676;
}
.filter-chip.active.bearish {
    background:rgba(255,82,82,0.1);
    border-color:rgba(255,82,82,0.4);
    color:#ff5252;
}
.filter-chip.active.neutral {
    background:rgba(255,183,77,0.1);
    border-color:rgba(255,183,77,0.4);
    color:#ffb74d;
}

/* ============================================================
   STATS
   ============================================================ */
.stats-bar {
    display:flex;
    gap:8px;
    padding:10px 14px 6px;
    max-width:1200px;
    margin:0 auto;
    flex-wrap:wrap;
}
.stat-pill {
    background:#131b26;
    border:1px solid #233142;
    border-radius:8px;
    padding:6px 10px;
    font-size:10.5px;
    color:#8a9ba8;
    font-weight:600;
    letter-spacing:0.2px;
}
.stat-pill strong { color:#fff; margin-left:4px; font-weight:800; }

/* ============================================================
   GRID
   ============================================================ */
.grid {
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));
    gap:14px;
    padding:14px;
    max-width:1200px;
    margin:0 auto;
}
@media (max-width: 600px) {
    .grid { grid-template-columns: 1fr; gap:12px; padding:12px; }
    .header-title-main { font-size:13px; }
    .header-logo { width:36px; height:36px; }
}

/* ============================================================
   CHART CARD
   ============================================================ */
.chart-card {
    background:#131b26;
    border:1px solid #233142;
    border-radius:12px;
    padding:14px;
    cursor:pointer;
    transition:transform 0.15s, border-color 0.2s, box-shadow 0.2s;
    position:relative;
    overflow:hidden;
}
.chart-card:hover {
    transform:translateY(-2px);
    border-color:rgba(0,230,118,0.35);
    box-shadow:0 8px 24px rgba(0,0,0,0.4);
}
.chart-card:active { transform:translateY(0); }

.chart-card-header {
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:8px;
    margin-bottom:10px;
}
.chart-card-num {
    font-size:10px;
    font-weight:800;
    letter-spacing:1.2px;
    color:#4d5c6b;
    text-transform:uppercase;
}
.chart-card-badge {
    font-size:9px;
    font-weight:800;
    letter-spacing:0.8px;
    text-transform:uppercase;
    padding:3px 8px;
    border-radius:12px;
    flex-shrink:0;
}
.chart-card-badge.bull {
    background:rgba(0,230,118,0.1);
    color:#00e676;
    border:1px solid rgba(0,230,118,0.3);
}
.chart-card-badge.bear {
    background:rgba(255,82,82,0.1);
    color:#ff5252;
    border:1px solid rgba(255,82,82,0.3);
}
.chart-card-badge.neutral {
    background:rgba(255,183,77,0.1);
    color:#ffb74d;
    border:1px solid rgba(255,183,77,0.3);
}

.chart-card-title {
    font-size:14.5px;
    font-weight:800;
    color:#fff;
    letter-spacing:-0.2px;
    margin-bottom:4px;
    line-height:1.25;
}
.chart-card-sub {
    font-size:11px;
    color:#8a9ba8;
    margin-bottom:12px;
    line-height:1.5;
}

.chart-card-canvas-wrap {
    background:#0d141e;
    border-radius:8px;
    padding:8px;
    margin-bottom:10px;
    border:1px solid #1c2836;
}
.chart-card-canvas-wrap canvas {
    width:100%;
    height:120px;
    display:block;
    border-radius:4px;
}

.chart-card-footer {
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    padding-top:8px;
    border-top:1px solid #1c2836;
}
.chart-card-tag {
    font-size:10px;
    font-weight:700;
    color:#64748b;
    letter-spacing:0.4px;
    text-transform:uppercase;
}
.chart-card-open {
    font-size:10px;
    font-weight:800;
    color:#00e676;
    letter-spacing:0.6px;
    text-transform:uppercase;
    display:flex;
    align-items:center;
    gap:4px;
}
.chart-card-open svg {
    width:11px;
    height:11px;
    stroke:currentColor;
    fill:none;
    stroke-width:2.6;
    stroke-linecap:round;
    stroke-linejoin:round;
}

/* ============================================================
   DETAIL MODAL
   ============================================================ */
.detail-modal {
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.88);
    backdrop-filter:blur(10px);
    z-index:500;
    display:none;
    align-items:center;
    justify-content:center;
    padding:14px;
    overflow-y:auto;
}
.detail-modal.show { display:flex; }
.detail-card {
    background:#0c1421;
    border:1px solid #233142;
    border-radius:16px;
    padding:22px 20px 20px;
    max-width:520px;
    width:100%;
    max-height:94vh;
    overflow-y:auto;
    position:relative;
    animation:detailIn 0.35s cubic-bezier(0.18, 0.89, 0.32, 1.28);
}
@keyframes detailIn {
    from { opacity:0; transform:translateY(24px) scale(0.96); }
    to { opacity:1; transform:translateY(0) scale(1); }
}
.detail-close {
    position:absolute;
    top:14px;
    right:14px;
    width:32px;
    height:32px;
    border-radius:8px;
    background:rgba(255,255,255,0.04);
    border:1px solid #233142;
    color:#8a9ba8;
    font-size:15px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:all 0.2s;
    z-index:2;
    font-family:inherit;
}
.detail-close:hover { color:#fff; background:rgba(255,255,255,0.08); }

.detail-num {
    font-size:10px;
    font-weight:800;
    letter-spacing:1.5px;
    color:#4d5c6b;
    text-transform:uppercase;
    margin-bottom:6px;
}
.detail-title {
    font-size:22px;
    font-weight:900;
    color:#fff;
    letter-spacing:-0.4px;
    margin-bottom:6px;
    line-height:1.2;
    padding-right:40px;
}
.detail-badge {
    display:inline-block;
    font-size:10px;
    font-weight:800;
    letter-spacing:0.9px;
    text-transform:uppercase;
    padding:4px 10px;
    border-radius:14px;
    margin-bottom:16px;
}
.detail-badge.bull {
    background:rgba(0,230,118,0.1);
    color:#00e676;
    border:1px solid rgba(0,230,118,0.35);
}
.detail-badge.bear {
    background:rgba(255,82,82,0.1);
    color:#ff5252;
    border:1px solid rgba(255,82,82,0.35);
}
.detail-badge.neutral {
    background:rgba(255,183,77,0.1);
    color:#ffb74d;
    border:1px solid rgba(255,183,77,0.35);
}

.detail-canvas-wrap {
    background:#0d141e;
    border:1px solid #1c2836;
    border-radius:12px;
    padding:12px;
    margin-bottom:16px;
}
.detail-canvas-wrap canvas {
    width:100%;
    height:240px;
    display:block;
    border-radius:6px;
}

.detail-desc {
    font-size:13.5px;
    line-height:1.75;
    color:#c2d1d9;
    white-space:pre-wrap;
    margin-bottom:16px;
}
.detail-desc strong { color:#fff; font-weight:700; }

.detail-section-title {
    font-size:11px;
    font-weight:800;
    letter-spacing:1.2px;
    text-transform:uppercase;
    color:#00e676;
    margin:16px 0 8px;
    padding-bottom:6px;
    border-bottom:1px solid #233142;
}
.detail-section-title.bear { color:#ff5252; }
.detail-section-title.warn { color:#ffb74d; }

.detail-tags {
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-top:12px;
}
.detail-tag {
    font-size:10px;
    font-weight:700;
    letter-spacing:0.4px;
    padding:4px 10px;
    border-radius:12px;
    background:rgba(255,255,255,0.04);
    border:1px solid #233142;
    color:#8a9ba8;
}

.no-result {
    grid-column:1/-1;
    text-align:center;
    padding:60px 20px;
    color:#4d5c6b;
    font-size:13px;
}
.no-result svg {
    width:44px;
    height:44px;
    stroke:#4d5c6b;
    fill:none;
    stroke-width:1.6;
    margin-bottom:12px;
    opacity:0.6;
}
</style>

<script>
/* ============================================================
   HEADER SKETCH LOGO — hexagon shield + trending chart line
   ============================================================ */
function drawHeaderLogo() {
    const canvas = document.getElementById('headerLogo');
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;
    ctx.clearRect(0, 0, W, H);
    const cx = W / 2, cy = H / 2;
    const scale = W / 80;

    /* Outer hexagon outline */
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
        const angle = (Math.PI / 3) * i - Math.PI / 6;
        const x = cx + 34 * scale * Math.cos(angle);
        const y = cy + 34 * scale * Math.sin(angle);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.strokeStyle = 'rgba(0, 230, 118, 0.6)';
    ctx.lineWidth = 1.6 * scale;
    ctx.lineJoin = 'round';
    ctx.stroke();

    /* Inner shield fill */
    ctx.beginPath();
    ctx.moveTo(cx, cy - 22 * scale);
    ctx.lineTo(cx + 18 * scale, cy - 12 * scale);
    ctx.lineTo(cx + 18 * scale, cy + 10 * scale);
    ctx.quadraticCurveTo(cx, cy + 26 * scale, cx, cy + 26 * scale);
    ctx.quadraticCurveTo(cx - 18 * scale, cy + 10 * scale, cx - 18 * scale, cy + 10 * scale);
    ctx.lineTo(cx - 18 * scale, cy - 12 * scale);
    ctx.closePath();
    ctx.fillStyle = '#0e1726';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
    ctx.lineWidth = 1 * scale;
    ctx.stroke();

    /* Trending chart line inside shield */
    ctx.beginPath();
    ctx.moveTo(cx - 11 * scale, cy + 6 * scale);
    ctx.lineTo(cx - 4 * scale, cy - 2 * scale);
    ctx.lineTo(cx + 1 * scale, cy + 2 * scale);
    ctx.lineTo(cx + 11 * scale, cy - 10 * scale);
    ctx.strokeStyle = '#00e676';
    ctx.lineWidth = 3 * scale;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();

    /* Arrow head at the end */
    ctx.beginPath();
    ctx.moveTo(cx + 6 * scale, cy - 10 * scale);
    ctx.lineTo(cx + 11 * scale, cy - 10 * scale);
    ctx.lineTo(cx + 11 * scale, cy - 5 * scale);
    ctx.strokeStyle = '#00e676';
    ctx.lineWidth = 2.6 * scale;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();

    /* Small dots on chart line */
    const dots = [
        { x: cx - 11 * scale, y: cy + 6 * scale },
        { x: cx - 4 * scale, y: cy - 2 * scale },
        { x: cx + 1 * scale, y: cy + 2 * scale },
    ];
    ctx.fillStyle = '#00e676';
    dots.forEach(d => {
        ctx.beginPath();
        ctx.arc(d.x, d.y, 1.8 * scale, 0, Math.PI * 2);
        ctx.fill();
    });
}
drawHeaderLogo();
window.addEventListener('resize', () => setTimeout(drawHeaderLogo, 100));

/* ============================================================
   100 CHART PATTERNS DATABASE
   ============================================================ */
const PATTERNS = [
    /* ============== 1-10: SINGLE CANDLE PATTERNS ============== */
    {
        id:'doji', name:'Doji', type:'neutral', tags:['candle','reversal'],
        candles:[{o:50,h:56,l:44,c:50}],
        desc1:`A Doji is a single-candle pattern where the open and close prices are nearly equal. It looks like a cross or plus sign. The body is very tiny (or invisible) and it has wicks on both sides.`,
        desc2:`• Open price ≈ Close price\n• Body is extremely small (less than 5% of the candle range)\n• Upper and lower wicks are roughly equal length\n• Appears after a trend or during consolidation\n• Colour doesn't matter (green or red)`,
        desc3:`• Wait for the NEXT candle to confirm direction\n• If next candle is green → CALL (UP)\n• If next candle is red → PUT (DOWN)\n• Never trade the Doji alone — always wait for confirmation\n• Place stop-loss below/above the Doji's wick`,
        desc4:`• Don't trade the Doji directly thinking it's a reversal\n• Don't ignore the trend context — Doji in an uptrend differs from one in a downtrend\n• Don't confuse Doji with small-body candles — check wick length`,
        desc5:`Doji alone: 50-55% accurate (basically a coin flip).\nDoji + next candle confirmation: 60-65% win rate.\nBest combined with support/resistance levels.`
    },
    {
        id:'hammer', name:'Hammer', type:'bull', tags:['candle','reversal'],
        candles:[{o:52,h:54,l:38,c:53}],
        desc1:`A Hammer is a bullish reversal candle that appears at the END of a downtrend. It has a small body at the top and a very long lower wick (2-3x the body). It looks like a hammer.`,
        desc2:`• Appears after a clear downtrend\n• Small body at the top of the range\n• Lower wick is 2x-3x the body length\n• Upper wick is very small or absent\n• Body color: green is stronger than red`,
        desc3:`• Wait for next green candle to confirm\n• Enter CALL (UP) after confirmation\n• Stop-loss below the Hammer's low\n• Target: previous resistance level`,
        desc4:`• Don't trade the Hammer alone — always wait for a confirming candle\n• Don't enter if the trend isn't clearly downward\n• Don't trade if volume is very low`,
        desc5:`At the end of downtrend: 65-70% accuracy.\nBest when combined with support zone.\nHigher success on higher timeframes.`
    },
    {
        id:'inv-hammer', name:'Inverted Hammer', type:'bull', tags:['candle','reversal'],
        candles:[{o:48,h:62,l:46,c:49}],
        desc1:`An Inverted Hammer is a bullish reversal candle that appears at the END of a downtrend. Long UPPER wick and small body at the bottom. It signals that buyers tried to push price up.`,
        desc2:`• Appears after downtrend\n• Small body at the BOTTOM\n• Upper wick is 2x-3x the body\n• Lower wick is very small or absent\n• Looks like an upside-down hammer`,
        desc3:`• Wait for next green candle\n• Enter CALL after confirmation\n• Stop-loss below the pattern's low\n• Weak pattern — always confirm`,
        desc4:`• Don't trade without confirmation\n• Rarely works in strong downtrends\n• Not the same as a Shooting Star (that's at the top)`,
        desc5:`With confirmation: 60-65%.\nAlone: 50-55% (unreliable).`
    },
    {

/* ============================================================
   STATE
   ============================================================ */
let currentFilter = 'all';
let currentSearch = '';

/* ============================================================
   CANVAS RENDERER
   ============================================================ */
function drawPatternOnCanvas(canvasEl, pattern, padding = 16) {
    const c = canvasEl.getContext('2d');
    const W = canvasEl.width;
    const H = canvasEl.height;
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.clearRect(0, 0, W, H);
    c.fillStyle = '#0d141e';
    c.fillRect(0, 0, W, H);
    const candles = pattern.candles;
    const n = candles.length;
    let minP = Infinity, maxP = -Infinity;
    candles.forEach(cc => { if (cc.l < minP) minP = cc.l; if (cc.h > maxP) maxP = cc.h; });
    const span = maxP - minP || 1;
    minP -= span * 0.15;
    maxP += span * 0.15;
    const plotW = W - padding * 2;
    const plotH = H - padding * 2;
    const slotW = plotW / n;
    const bodyW = Math.max(6, slotW * 0.55);
    const yOf = p => padding + plotH - ((p - minP) / (maxP - minP)) * plotH;
    const xOf = i => padding + i * slotW + slotW / 2;

    c.strokeStyle = 'rgba(20,30,41,0.7)';
    c.lineWidth = 1;
    for (let i = 1; i < 4; i++) {
        const y = Math.round(padding + (plotH / 4) * i) + 0.5;
        c.beginPath(); c.moveTo(padding, y); c.lineTo(padding + plotW, y); c.stroke();
    }
    for (let i = 1; i < n; i++) {
        const x = Math.round(padding + slotW * i) + 0.5;
        c.strokeStyle = 'rgba(20,30,41,0.4)';
        c.beginPath(); c.moveTo(x, padding); c.lineTo(x, padding + plotH); c.stroke();
    }

    candles.forEach((cc, i) => {
        const x = xOf(i);
        const up = cc.c >= cc.o;
        const col = up ? '#00e676' : '#ff5252';
        c.strokeStyle = col;
        c.lineWidth = Math.max(1.2, W / 500);
        c.beginPath();
        c.moveTo(Math.round(x) + 0.5, yOf(cc.h));
        c.lineTo(Math.round(x) + 0.5, yOf(cc.l));
        c.stroke();
        const yO = yOf(cc.o), yC = yOf(cc.c);
        const top = Math.min(yO, yC);
        const hgt = Math.max(Math.abs(yC - yO), 3);
        c.fillStyle = col;
        c.fillRect(x - bodyW / 2, top, bodyW, hgt);
    });
}

/* ============================================================
   RENDER GRID
   ============================================================ */
function matchesFilter(p) {
    if (currentFilter !== 'all' && !p.tags.includes(currentFilter)) return false;
    if (currentSearch) {
        const q = currentSearch.toLowerCase().trim();
        const hay = (p.name + ' ' + p.tags.join(' ') + ' ' + p.desc1).toLowerCase();
        if (!hay.includes(q)) return false;
    }
    return true;
}

function renderGrid() {
    const grid = document.getElementById('chartGrid');
    grid.innerHTML = '';
    const filtered = PATTERNS.filter(matchesFilter);

    document.getElementById('statTotal').textContent = PATTERNS.length;
    document.getElementById('statShowing').textContent = filtered.length;
    document.getElementById('statBull').textContent = PATTERNS.filter(p => p.type === 'bull').length;
    document.getElementById('statBear').textContent = PATTERNS.filter(p => p.type === 'bear').length;
    document.getElementById('statNeutral').textContent = PATTERNS.filter(p => p.type === 'neutral').length;
    document.getElementById('chartCount').textContent = filtered.length + ' / ' + PATTERNS.length + ' charts';

    if (!filtered.length) {
        grid.innerHTML = `
            <div class="no-result">
                <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
                <div>No patterns match your search.</div>
            </div>`;
        return;
    }

    filtered.forEach(p => {
        const card = document.createElement('div');
        card.className = 'chart-card';

        const badgeClass = p.type === 'bull' ? 'bull' : p.type === 'bear' ? 'bear' : 'neutral';
        const badgeText = p.type === 'bull' ? '▲ BULLISH' : p.type === 'bear' ? '▼ BEARISH' : '◆ NEUTRAL';

        card.innerHTML = `
            <div class="chart-card-header">
                <div class="chart-card-num">#${String(PATTERNS.indexOf(p) + 1).padStart(3, '0')}</div>
                <div class="chart-card-badge ${badgeClass}">${badgeText}</div>
            </div>
            <div class="chart-card-title">${p.name}</div>
            <div class="chart-card-sub">${p.desc1.split('.')[0]}.</div>
            <div class="chart-card-canvas-wrap">
                <canvas width="600" height="240"></canvas>
            </div>
            <div class="chart-card-footer">
                <div class="chart-card-tag">${p.tags.slice(0, 2).join(' • ')}</div>
                <div class="chart-card-open">
                    Learn
                    <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                </div>
            </div>
        `;

        card.addEventListener('click', () => openDetail(p));
        grid.appendChild(card);

        const cvs = card.querySelector('canvas');
        requestAnimationFrame(() => drawPatternOnCanvas(cvs, p, 14));
    });
}

/* ============================================================
   DETAIL MODAL
   ============================================================ */
function openDetail(p) {
    const idx = PATTERNS.indexOf(p) + 1;
    const badgeClass = p.type === 'bull' ? 'bull' : p.type === 'bear' ? 'bear' : 'neutral';
    const badgeText = p.type === 'bull' ? '▲ BULLISH SIGNAL' : p.type === 'bear' ? '▼ BEARISH SIGNAL' : '◆ NEUTRAL / INDECISION';

    document.getElementById('dNum').textContent = 'Pattern #' + String(idx).padStart(3, '0');
    document.getElementById('dTitle').textContent = p.name;
    const badgeEl = document.getElementById('dBadge');
    badgeEl.className = 'detail-badge ' + badgeClass;
    badgeEl.textContent = badgeText;

    document.getElementById('dDesc1').textContent = p.desc1;
    document.getElementById('dDesc2').textContent = p.desc2;
    document.getElementById('dDesc3').textContent = p.desc3;
    document.getElementById('dDesc4').textContent = p.desc4;
    document.getElementById('dDesc5').textContent = p.desc5;

    const sec3 = document.getElementById('dSection3');
    sec3.className = 'detail-section-title';
    if (p.type === 'bear') sec3.classList.add('bear');
    if (p.type === 'neutral') sec3.classList.add('warn');

    document.getElementById('dTags').innerHTML = p.tags.map(t => `<div class="detail-tag">${t}</div>`).join('');

    document.getElementById('detailModal').classList.add('show');
    document.body.style.overflow = 'hidden';

    requestAnimationFrame(() => {
        const big = document.getElementById('detailCanvas');
        big.width = 960;
        big.height = 480;
        drawPatternOnCanvas(big, p, 24);
    });
}

function closeDetail() {
    document.getElementById('detailModal').classList.remove('show');
    document.body.style.overflow = '';
}

document.getElementById('detailModal').addEventListener('click', (e) => {
    if (e.target.id === 'detailModal') closeDetail();
});

document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeDetail();
});

/* ============================================================
   FILTERS + SEARCH
   ============================================================ */
document.querySelectorAll('.filter-chip').forEach(chip => {
    chip.addEventListener('click', () => {
        document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        currentFilter = chip.dataset.filter;
        renderGrid();
    });
});

document.getElementById('searchInput').addEventListener('input', (e) => {
    currentSearch = e.target.value;
    renderGrid();
});

/* ============================================================
   INIT
   ============================================================ */
renderGrid();
</script>
